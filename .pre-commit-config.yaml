repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: rustfmt
        name: Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        files: ^src/rust/.*\.rs$
        pass_filenames: false
      - id: readme-examples
        name: README notebook examples
        entry: python tools/notebooks.py --check
        language: python
        files: ^(README\.md|examples/.*\.ipynb|tools/notebooks\.py)$
        pass_filenames: false
      - id: mypy
        name: Type check Python backends
        entry: uv run --locked --extra dev mypy
        language: system
        files: ^(src/.*\.py|pyproject\.toml|uv\.lock)$
        pass_filenames: false
