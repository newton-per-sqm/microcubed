name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Require a tag matching the package version
        shell: bash
        run: |
          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$package_version"
          test "v$package_version" = "${{ github.event.release.tag_name }}"

  wheels:
    needs: verify-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: '2_28'
            artifact: wheels-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            artifact: wheels-linux-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            manylinux: 'off'
            artifact: wheels-macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: 'off'
            artifact: wheels-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
            artifact: wheels-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build release wheel
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --locked --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/microcubed/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: source-distribution
          path: dist
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
