name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev pre-commit run --all-files
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - name: Require the compiled backend
        run: uv run --locked --extra dev python -c "from microcubed import get_backend; get_backend('rust')"
      - run: uv run --locked --extra dev pytest -rFEx --durations 10

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra examples --extra docs
      - run: uv run --locked --extra examples python tools/notebooks.py --check --execute
      - run: uv run --locked --extra docs sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v6
        with:
          name: examples
          path: build/examples/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/_build/html/
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel from sdist
        run: uv build
      - run: uvx twine check dist/*
      - name: Test the installed wheel outside the checkout
        shell: bash
        run: |
          uv venv "$RUNNER_TEMP/wheel-test"
          uv pip install --python "$RUNNER_TEMP/wheel-test/bin/python" dist/*.whl pytest
          cp -r tests "$RUNNER_TEMP/wheel-tests"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-test/bin/python" -c "from microcubed import get_backend; get_backend('rust')"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pytest wheel-tests --ignore=wheel-tests/test_examples.py
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
