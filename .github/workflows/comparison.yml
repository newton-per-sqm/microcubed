name: Optional OOMMF comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MICROCUBED_RUN_OOMMF: '1'
      OOMMF_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra examples --extra docs --extra comparison
      # oommfc discovers its Docker runner on the Ubuntu GitHub-hosted runner.
      - run: uv run --locked --extra examples --extra comparison python tools/notebooks.py --check --execute --include-optional
      - run: uv run --locked --extra docs --extra comparison sphinx-build -E -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v6
        with:
          name: oommf-comparison
          path: |
            build/examples/
            docs/_build/html/
          if-no-files-found: error
