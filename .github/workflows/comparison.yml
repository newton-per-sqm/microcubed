name: Optional OOMMF comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MICROCUBED_RUN_OOMMF: '1'
      OOMMF_THREADS: '2'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra examples --extra docs --extra comparison
      - name: Install OOMMF
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tcl-dev tk-dev
          git clone --branch 21a0-1_20230927 --depth 1 \
            https://github.com/fangohr/oommf.git "$RUNNER_TEMP/oommf"
          make -C "$RUNNER_TEMP/oommf" build
          echo "OOMMFTCL=$RUNNER_TEMP/oommf/oommf/oommf.tcl" >> "$GITHUB_ENV"
      - run: uv run --locked --extra examples --extra comparison python tools/notebooks.py --check --execute --include-optional
      - run: uv run --locked --extra docs --extra comparison sphinx-build -E -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v6
        with:
          name: oommf-comparison
          path: |
            build/examples/
            docs/_build/html/
          if-no-files-found: error
