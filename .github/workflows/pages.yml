name: Publish documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_oommf:
        description: Execute the optional Ubermag/OOMMF comparison (uses Docker)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MICROCUBED_RUN_OOMMF: ${{ inputs.include_oommf && '1' || '0' }}
      OOMMF_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install documentation dependencies
        if: ${{ !inputs.include_oommf }}
        run: uv sync --locked --extra docs
      - name: Install optional solver dependencies
        if: ${{ inputs.include_oommf }}
        run: uv sync --locked --extra docs --extra comparison
      - name: Install OOMMF
        if: ${{ inputs.include_oommf }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes tcl-dev tk-dev
          git clone --branch 21a0-1_20230927 --depth 1 \
            https://github.com/fangohr/oommf.git "$RUNNER_TEMP/oommf"
          make -C "$RUNNER_TEMP/oommf" build
          echo "OOMMFTCL=$RUNNER_TEMP/oommf/oommf/oommf.tcl" >> "$GITHUB_ENV"
      - name: Build and execute documentation
        # --no-sync preserves the optional dependencies selected above.
        run: uv run --no-sync sphinx-build -E -W --keep-going -b html -D html_baseurl="${{ steps.pages.outputs.base_url }}/" docs docs/_build/html
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
