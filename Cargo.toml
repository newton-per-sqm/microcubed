[package]
name = "microcubed"
version = "1.0.0"
edition = "2021"
description = "Calculate 3D stray fields of cuboid micro magnet arrangements."
license = "MIT"
repository = "https://github.com/newton-per-sqm/microcubed"
homepage = "https://github.com/newton-per-sqm/microcubed"

[lib]
name = "_rust"
path = "src/rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
indicatif = "0.18.6"
ndarray = { version = "0.17.2", features = ["rayon"] }
num_cpus = "1.17"
numpy = "0.29.0"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py312"] }
rayon = "1.12.0"
