[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[project]
name = "microcubed"
dynamic = ["version"] # read from Cargo.toml by maturin
description = "Calculate 3D stray fields of cuboid micro magnet arrangements."
authors = [
    { name = "Pascal Muster", email = "Pascal.Muster@infineon.com" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE.txt" }
keywords = ["magnetism", "micromagnetics", "magnetic-field", "rust", "numpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.urls]
Homepage = "https://github.com/newton-per-sqm/microcubed"
Documentation = "https://newton-per-sqm.github.io/microcubed/"
Repository = "https://github.com/newton-per-sqm/microcubed"
Issues = "https://github.com/newton-per-sqm/microcubed/issues"

[project.optional-dependencies]
comparison = ["discretisedfield>=0.92.0", "micromagneticmodel>=0.65.0", "oommfc>=0.66.0", "pandas>=3.0.5"]
examples = ["ipykernel>=7.3.0", "nbconvert>=7.17.0", "nbformat>=5.10.4"]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

docs = ["furo>=2025.12.19", "myst-nb>=1.3.0", "ipykernel>=7.3.0", "myst-parser[linkify]>=5.1.0", "sphinx>=9.1.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
module-name = "microcubed._rust"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true

# Incremental baseline for modules with pre-existing type errors.
[[tool.mypy.overrides]]
module = [
    "microcubed",
    "microcubed.base",
    "microcubed.geometry",
    "microcubed.utils",
    "microcubed.viz",
]
ignore_errors = true

[tool.ruff]
# https://docs.astral.sh/ruff/settings
target-version = "py312"
line-length = 120
fix = false  # Allow autofix for all enabled rules (when `--fix`) is provided.
show-fixes = true
unsafe-fixes = false

[tool.ruff.lint.isort]
known-first-party = ["microcubed"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]
"__init__.py" = ["F401"]
